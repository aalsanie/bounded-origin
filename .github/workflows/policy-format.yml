name: Policy Formatting

on:
  push:
    branches:
      - compile-declarative-origin-policies

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: compile-declarative-origin-policies
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - run: ./gradlew :bounded-origin-cli:spotlessApply
      - name: Commit canonical formatting
        shell: bash
        run: |
          git add \
            bounded-origin-cli/src/main/java/io/github/aalsanie/boundedorigin/cli/ConfiguredPolicyMatcher.java \
            bounded-origin-cli/src/main/java/io/github/aalsanie/boundedorigin/cli/PolicyConfigurationCompiler.java \
            bounded-origin-cli/src/test/java/io/github/aalsanie/boundedorigin/cli/ConfigurationTestSupport.java \
            bounded-origin-cli/src/test/java/io/github/aalsanie/boundedorigin/cli/PolicyConfigurationCompilerTest.java \
            bounded-origin-cli/src/test/java/io/github/aalsanie/boundedorigin/cli/PolicyConfigurationCompilerValidationTest.java \
            bounded-origin-cli/src/test/java/io/github/aalsanie/boundedorigin/cli/YamlConfigurationLoaderTest.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(cli): apply canonical policy formatting'
          git push origin HEAD:compile-declarative-origin-policies
