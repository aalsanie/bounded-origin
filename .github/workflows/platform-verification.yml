name: Platform verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify
        run: ./gradlew clean check --stacktrace
        if: runner.os != 'Windows'
      - name: Verify
        run: .\gradlew.bat clean check --stacktrace
        if: runner.os == 'Windows'
