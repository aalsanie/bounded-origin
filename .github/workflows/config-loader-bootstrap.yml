name: Configuration loader bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Generate dependency verification metadata
        run: ./gradlew --write-verification-metadata sha256 :bounded-origin-cli:dependencies --stacktrace

      - name: Format sources
        run: ./gradlew spotlessApply --stacktrace

      - name: Generate API snapshot
        run: ./gradlew :bounded-origin-cli:apiDump --stacktrace

      - name: Verify dependency locks
        run: ./scripts/verify-locks.sh

      - name: Commit generated state
        run: |
          git config user.name "aalsanie"
          git config user.email "22101794+aalsanie@users.noreply.github.com"
          git add gradle/verification-metadata.xml bounded-origin-cli/api/bounded-origin-cli.api bounded-origin-cli/src/main/java bounded-origin-cli/src/test/java
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: record configuration loader verification state"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Verify CLI
        run: ./gradlew :bounded-origin-cli:test :bounded-origin-cli:jacocoTestCoverageVerification :bounded-origin-cli:spotbugsMain :bounded-origin-cli:spotbugsTest :bounded-origin-cli:pitest :bounded-origin-cli:apiCheck spotlessCheck --continue --info --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: configuration-loader-bootstrap
          path: |
            gradle/verification-metadata.xml
            bounded-origin-cli/api/bounded-origin-cli.api
            bounded-origin-cli/src/main/java
            bounded-origin-cli/src/test/java
            bounded-origin-cli/build/reports
          if-no-files-found: warn
