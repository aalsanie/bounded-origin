name: Release Verification

on:
  push:
    branches: [release/0.1.0]
  pull_request:
    branches: [main]
    paths:
      - build.gradle.kts
      - bounded-origin-cli/build.gradle.kts
      - release-tests/**
      - scripts/verify-release-*.sh
      - .github/workflows/release-verification.yml
      - .github/workflows/release.yml
      - .github/workflows/central-preflight.yml
      - scripts/central-portal.sh
      - scripts/verify-release-workflow-policy.sh

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  central-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Build and verify Central bundle with ephemeral signing key
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/bounded-origin-release-gpg"
          install -d -m 700 "$GNUPGHOME"

          if ./gradlew :bounded-origin-api:verifyCentralSigningCredentials --stacktrace; then
            echo "Central signing credential verification unexpectedly passed without a key" >&2
            exit 1
          fi

          cat > "$RUNNER_TEMP/bounded-origin-release-key.conf" <<'EOF'
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Bounded Origin CI
          Name-Email: ci@bounded-origin.invalid
          Expire-Date: 0
          Passphrase: bounded-origin-ci-only
          %commit
          EOF

          gpg --batch --generate-key "$RUNNER_TEMP/bounded-origin-release-key.conf"
          export ORG_GRADLE_PROJECT_signingKey
          ORG_GRADLE_PROJECT_signingKey="$(
            gpg --batch --pinentry-mode loopback \
              --passphrase bounded-origin-ci-only \
              --armor --export-secret-keys ci@bounded-origin.invalid
          )"
          export ORG_GRADLE_PROJECT_signingPassword=bounded-origin-ci-only

          ./gradlew centralBundle --stacktrace

          test -s build/distributions/bounded-origin-0.1.0-central-bundle.zip

          signature_count=0
          while IFS= read -r -d '' signature; do
            gpg --batch --verify "$signature" "${signature%.asc}"
            signature_count=$((signature_count + 1))
          done < <(find build/central-staging -type f -name '*.asc' -print0)

          test "$signature_count" -eq 16

      - name: Negative release-contract tests
        shell: bash
        run: bash scripts/verify-release-negative.sh

  cli-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Build and verify CLI release artifacts
        run: ./gradlew :bounded-origin-cli:cliReleaseArtifacts --stacktrace

  external-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Resolve and run isolated Maven consumer
        run: ./gradlew verifyExternalMavenConsumer --stacktrace

  release-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Verify release artifact reproducibility
        shell: bash
        run: bash scripts/verify-release-reproducible.sh

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify tag-only release policy
        run: bash scripts/verify-release-workflow-policy.sh
