name: Release Verification

on:
  workflow_call:
    inputs:
      approved:
        required: true
        type: boolean
  push:
    branches: [release/0.1.0]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Release verification preflight
    if: github.event_name == 'push' && !inputs.approved
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI approver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/ci-approved" --jq \
            'if .can_admins_bypass == false then [.protection_rules[] | select(.type == "required_reviewers" and .prevent_self_review == false and (.reviewers | length) == 1 and .reviewers[0].type == "User" and .reviewers[0].reviewer.id == 22101794)] | length else 0 end' \
            | grep -qx '1'

  authorize:
    name: Approve release verification
    if: github.event_name == 'push' && !inputs.approved
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: ci-approved
      deployment: false
    steps:
      - run: echo "Release verification approved"

  central-bundle:
    needs: authorize
    if: always() && (inputs.approved == true || needs.authorize.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Build and verify Central bundle with ephemeral signing key
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/bounded-origin-release-gpg"
          install -d -m 700 "$GNUPGHOME"

          if ./gradlew :bounded-origin-api:verifyCentralSigningCredentials --stacktrace; then
            echo "Central signing credential verification unexpectedly passed without a key" >&2
            exit 1
          fi

          cat > "$RUNNER_TEMP/bounded-origin-release-key.conf" <<'EOF'
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Bounded Origin CI
          Name-Email: ci@bounded-origin.invalid
          Expire-Date: 0
          Passphrase: bounded-origin-ci-only
          %commit
          EOF

          gpg --batch --generate-key "$RUNNER_TEMP/bounded-origin-release-key.conf"
          export ORG_GRADLE_PROJECT_signingKey
          ORG_GRADLE_PROJECT_signingKey="$(
            gpg --batch --pinentry-mode loopback \
              --passphrase bounded-origin-ci-only \
              --armor --export-secret-keys ci@bounded-origin.invalid
          )"
          export ORG_GRADLE_PROJECT_signingPassword=bounded-origin-ci-only

          ./gradlew centralBundle --stacktrace

          test -s build/distributions/bounded-origin-0.1.0-central-bundle.zip

          signature_count=0
          while IFS= read -r -d '' signature; do
            gpg --batch --verify "$signature" "${signature%.asc}"
            signature_count=$((signature_count + 1))
          done < <(find build/central-staging -type f -name '*.asc' -print0)

          test "$signature_count" -eq 16

      - name: Negative release-contract tests
        shell: bash
        run: bash scripts/verify-release-negative.sh

  cli-release:
    needs: authorize
    if: always() && (inputs.approved == true || needs.authorize.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Build and verify CLI release artifacts
        run: ./gradlew :bounded-origin-cli:cliReleaseArtifacts --stacktrace

  external-consumer:
    needs: authorize
    if: always() && (inputs.approved == true || needs.authorize.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Resolve and run isolated Maven consumer
        run: ./gradlew verifyExternalMavenConsumer --stacktrace

  release-reproducibility:
    needs: authorize
    if: always() && (inputs.approved == true || needs.authorize.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Verify release artifact reproducibility
        shell: bash
        run: bash scripts/verify-release-reproducible.sh

  release-policy:
    needs: authorize
    if: always() && (inputs.approved == true || needs.authorize.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify tag-only release policy
        run: bash scripts/verify-release-workflow-policy.sh
