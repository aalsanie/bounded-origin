[versions]
google-java-format = "1.36.1"
jacoco = "0.8.15"
junit = "6.1.3"
pitest = "1.30.0"
pitest-gradle = "1.19.0"
pitest-junit5 = "1.2.3"
spotbugs = "4.10.3"
spotbugs-gradle = "6.5.11"
spotless = "8.10.2"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
