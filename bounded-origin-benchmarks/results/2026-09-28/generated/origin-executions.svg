<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 546" role="img" aria-labelledby="title desc">
<title id="title">Origin executions by client concurrency</title>
<desc id="desc">Direct origin, concurrency 1: mean 256, range 256 to 256. Direct origin, concurrency 4: mean 256, range 256 to 256. Direct origin, concurrency 16: mean 256, range 256 to 256. Direct origin, concurrency 64: mean 256, range 256 to 256. BOUNDED_COMPUTE, concurrency 1: mean 256, range 256 to 256. BOUNDED_COMPUTE, concurrency 4: mean 64, range 64 to 64. BOUNDED_COMPUTE, concurrency 16: mean 16.9, range 16 to 17. BOUNDED_COMPUTE, concurrency 64: mean 10, range 9 to 13. MATERIALIZE, concurrency 1: mean 1, range 1 to 1. MATERIALIZE, concurrency 4: mean 1, range 1 to 1. MATERIALIZE, concurrency 16: mean 1, range 1 to 1. MATERIALIZE, concurrency 64: mean 1, range 1 to 1.</desc>
